name: Deploy to EC2

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_KEY }}
                  script: |
                      set -e
                      export NVM_DIR="$HOME/.nvm"
                      if [ -s "$NVM_DIR/nvm.sh" ]; then
                          . "$NVM_DIR/nvm.sh"
                      fi
                      cd ~/kasey-creative-canvas
                      # Use a shallow fetch/reset to avoid growing the local .git history
                      if [ -d ~/kasey-creative-canvas/.git ]; then
                          git -C ~/kasey-creative-canvas fetch --depth=1 origin main
                          git -C ~/kasey-creative-canvas reset --hard origin/main
                      else
                          # Fallback: clone a shallow copy from GitHub (expanded by Actions)
                          git clone --depth=1 https://github.com/${{ github.repository }}.git ~/kasey-creative-canvas || true
                      fi
                      npm ci --omit=dev
                      pm2 restart kasey-creative-canvas
                      for attempt in $(seq 1 10); do
                          if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
                              exit 0
                          fi
                          if [ "$attempt" -eq 10 ]; then
                              pm2 logs kasey-creative-canvas --err --lines 30 --nostream
                              exit 1
                          fi
                          sleep 3
                      done
